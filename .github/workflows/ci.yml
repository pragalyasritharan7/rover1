name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Tests & CLI Engine
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Pytest Suite (28 Tests)
      run: |
        python -m pytest backend/tests -v

    - name: Verify Headless CLI Simulation
      run: |
        python backend/cli.py --seed 42 --strategy value_aware --size 25 --energy 220

    - name: Verify Multi-Seed Comparison Benchmark
      run: |
        python backend/cli.py --compare --runs 2

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Build Production Frontend
      run: |
        cd frontend
        npm run build
